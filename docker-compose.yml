# Docker Dashboard
#
#   docker compose up -d --build
#   docker compose logs dashboard    # shows the generated sign-in token
#
# then open http://localhost:8080 and sign in with that token. It is saved in
# the dashboard-data volume and reused on restart. To pick your own instead,
# put DASHBOARD_TOKEN=... (at least 16 characters) in .env.

services:
  dashboard:
    build: .
    image: docker-dashboard:local
    restart: unless-stopped
    ports:
      # Bound to localhost by default. Put a TLS reverse proxy in front
      # before exposing it to a network.
      - "127.0.0.1:8080:8080"
    environment:
      # Optional: when empty, a token is generated and saved to the file below.
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      DASHBOARD_TOKEN_FILE: /data/token
      # Read-only by default; set READ_ONLY=false in .env to allow changes.
      READ_ONLY: ${READ_ONLY:-true}
      # Optional private registry for the Registry tab:
      REGISTRY_URL: ${REGISTRY_URL:-}
      REGISTRY_USERNAME: ${REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
    volumes:
      # Full control of Docker. Note: ":ro" on a socket does NOT make the API
      # read-only; READ_ONLY or the socket proxy below does that.
      - /var/run/docker.sock:/var/run/docker.sock
      - dashboard-data:/data

  # ---- Hardened alternative: talk to Docker through a filtering proxy.
  # Remove the socket mount above, set DOCKER_HOST=tcp://socket-proxy:2375 on
  # the dashboard, and enable this service. Flip POST/DELETE to 0 for a
  # strictly read-only dashboard.
  #
  # socket-proxy:
  #   image: tecnativa/docker-socket-proxy:latest
  #   restart: unless-stopped
  #   environment:
  #     CONTAINERS: 1
  #     IMAGES: 1
  #     VOLUMES: 1
  #     NETWORKS: 1
  #     INFO: 1
  #     SYSTEM: 1
  #     POST: 1
  #     DELETE: 1
  #     ALLOW_START: 1
  #     ALLOW_STOP: 1
  #     ALLOW_RESTARTS: 1
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  dashboard-data:
