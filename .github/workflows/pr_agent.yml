name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    # Run on PR events, or on PR comments from the owner, org members and collaborators only.
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event.issue.pull_request &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: PR Agent
        uses: Rikul/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OpenRouter: LLM_MODEL is any OpenRouter model ID, e.g. deepseek/deepseek-v4.1-flash-1017
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_KEY }}
          CONFIG__MODEL: openrouter/${{ vars.LLM_MODEL }}
          CONFIG__MODEL_WEAK: openrouter/${{ vars.LLM_MODEL }}
          CONFIG__MODEL_REASONING: openrouter/${{ vars.LLM_MODEL }}
          CONFIG__FALLBACK_MODELS: '[]'
          # Input token budget for models PR-Agent doesn't know. PR-Agent also caps input at
          # CONFIG__MAX_MODEL_TOKENS (default 32000), so raise both to send bigger diffs.
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS || '32000' }}
          # What runs automatically when a PR opens
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'false'
